<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ariestar — student, software developer, and DIY enthusiast.">
  <title>Ariestar — Personal Site</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #f4f4f1; color: #20211e; }
    main { width: min(100%, 44rem); padding: clamp(2rem, 8vw, 5rem); background: #fff; border: 1px solid #e1e1dc; border-radius: 1.25rem; box-shadow: 0 1.5rem 4rem #25251a12; }
    p.kicker { margin: 0 0 1rem; color: #66735b; font-size: .82rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 4.5rem); line-height: 1; letter-spacing: -.055em; }
    .intro { margin: 1.5rem 0 0; max-width: 34rem; color: #55574f; font-size: clamp(1.1rem, 3vw, 1.35rem); line-height: 1.7; }
    .rule { width: 3rem; height: 3px; margin: 2rem 0; border: 0; background: #9aab7c; }
    .note { margin: 0; color: #73756d; line-height: 1.7; }
    @media (prefers-color-scheme: dark) { body { background: #171815; color: #f1f2ec; } main { background: #22231f; border-color: #393a34; box-shadow: 0 1.5rem 4rem #0004; } .intro { color: #c1c3b9; } .note { color: #a1a398; } }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Personal site</p>
    <h1>Hi, I’m Ariestar.</h1>
    <p class="intro">I’m a student who loves software development and is interested in DIY. I hope to meet people who enjoy the same things.</p>
    <hr class="rule">
    <p class="note">Thanks for stopping by.</p>
  </main>
</body>
</html>
